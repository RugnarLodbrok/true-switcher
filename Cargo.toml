[package]
name = "true-switcher"
version = "0.2.0"
edition = "2024"
rust-version = "1.89"
default-run = "true-switcher"

[dependencies]
clap = "4.6"
env_logger = "0.11"
evdev = "0.13.2"
libpulse-binding = "2"
libpulse-simple-binding = "2"
log = "0.4"
nix = { version = "0.29.0", features = ["signal", "inotify"] }
regex = "1.13.1"
regex-syntax = "0.8.11"
rusqlite = { version = "0.41.1", features = ["bundled"] }
rustline = "0.1.0"
serde = { version = "1", features = ["derive"] }
tempfile = "3"
toml = "1"
toml_edit = "0.25"
xkbcommon = "0.9.0"
zbus = "5"

[dev-dependencies]
nix = { version = "0.29.0", features = ["term"] }
