[package]
name = "true-switcher"
version = "0.2.0"
edition = "2024"
rust-version = "1.89"
default-run = "true-switcher"

[[bin]]
name = "learn"
path = "src-learn/main.rs"

[[bin]]
name = "learn-xkb-threads"
path = "src-learn/xkb_threads.rs"

[dependencies]
env_logger = "0.11"
evdev = "0.13.2"
libpulse-binding = "2"
libpulse-simple-binding = "2"
log = "0.4"
nix = { version = "0.29.0", features = ["signal", "inotify"] }
regex = "1.13.1"
rusqlite = { version = "0.41.1", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
toml = "1"
xkbcommon = "0.9.0"
zbus = "5"
